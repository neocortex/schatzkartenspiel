<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schatzkartenspiel - Das Abenteuer von Tadeo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-wrapper {
        position: relative;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }

      /* ── DOM text overlay (positioned over the game canvas) ── */
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        font-family: 'Press Start 2P', monospace;
        overflow: hidden;
      }

      /* HUD bar — hidden, quest text now rendered by Phaser */
      #hud-bar {
        display: none;
      }

      /* Dialogue box */
      #dialogue-box {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(26, 26, 46, 0.96);
        border-top: 2px solid #e0e0e0;
        padding: 12px 16px 12px 16px;
        display: none;
        z-index: 20;
        min-height: 120px;
      }
      #dialogue-box.with-portrait {
        padding-left: 100px;
      }
      #dialogue-portrait {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        width: 72px;
        height: 72px;
        image-rendering: pixelated;
        display: none;
      }
      #dialogue-speaker {
        color: #ffc107;
        font-size: 11px;
        font-weight: 400;
        margin-bottom: 6px;
        text-shadow: 1px 1px 0px #000;
      }
      #dialogue-text {
        color: #ffffff;
        font-size: 10px;
        line-height: 1.8;
        min-height: 44px;
        text-shadow: 1px 1px 0px #000;
      }
      #dialogue-prompt {
        position: absolute;
        bottom: 8px;
        right: 14px;
        color: #ffc107;
        font-size: 14px;
        animation: blink 0.8s ease-in-out infinite;
        display: none;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      #narration-status {
        position: absolute;
        top: 6px;
        right: 8px;
        color: #8bc34a;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 2px 4px;
        font-size: 6px;
        line-height: 1.4;
        text-shadow: 1px 1px 0 #000;
        z-index: 25;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="ui-overlay">
        <div id="narration-status">Erzählerstimme: ...</div>
        <div id="hud-bar">
          <span id="hud-quest"></span>
        </div>
        <div id="dialogue-box">
          <canvas id="dialogue-portrait" width="32" height="32"></canvas>
          <div id="dialogue-speaker"></div>
          <div id="dialogue-text"></div>
          <div id="dialogue-prompt">▼</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
